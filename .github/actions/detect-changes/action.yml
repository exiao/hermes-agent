name: Detect affected areas
description: >-
  Classify changed files into CI work lanes (python, frontend, site, scan,
  deps, mcp_catalog). Ordinary pushes fail open; the exact live-config push
  path may use a narrow Python-only gate only for a proven allowlisted diff.

inputs:
  github-token:
    description: Token for the GitHub API (gh CLI). Pass steps.app-token.outputs.token from the calling workflow.
    required: false
    default: ${{ github.token }}
  classification_mode:
    description: Use live_config_push only for the exact live-config push gate.
    required: false
    default: standard
  push_before:
    description: Previous SHA from the push event, used by live_config_push.
    required: false
    default: ""
  push_after:
    description: New SHA from the push event, used by live_config_push.
    required: false
    default: ""

outputs:
  python:
    description: Run Python tests / ruff / ty / windows-footguns.
    value: ${{ steps.classify.outputs.python }}
  frontend:
    description: Run the TypeScript testing matrix + desktop build.
    value: ${{ steps.classify.outputs.frontend }}
  docker_meta:
    description: Docker setup and meta files have changed.
    value: ${{ steps.classify.outputs.docker_meta }}
  site:
    description: Build the Docusaurus docs site.
    value: ${{ steps.classify.outputs.site }}
  scan:
    description: Run the supply-chain critical-pattern scanner.
    value: ${{ steps.classify.outputs.scan }}
  deps:
    description: Check pyproject.toml dependency upper bounds.
    value: ${{ steps.classify.outputs.deps }}
  npm_lock:
    description: Post/update the semantic package-lock.json diff PR comment.
    value: ${{ steps.classify.outputs.npm_lock }}
  mcp_catalog:
    description: Require MCP catalog security review label.
    value: ${{ steps.classify.outputs.mcp_catalog }}
  ci_review:
    description: Require CI-sensitive file review label.
    value: ${{ steps.classify.outputs.ci_review }}
  ci_review_files:
    description: JSON list of CI-sensitive files changed by the pull request.
    value: ${{ steps.classify.outputs.ci_review_files }}
  live_config_python_only:
    description: True only for a nonempty, fully allowlisted live-config Python diff.
    value: ${{ steps.classify.outputs.live_config_python_only }}

runs:
  using: composite
  steps:
    - name: Classify changed files
      id: classify
      shell: bash
      env:
        # Fall back to the built-in read-only token when the caller passes an
        # empty value. Fork PRs get no repo secrets, so AUTOFIX_BOT_PAT is ""
        # there, and an input `default:` only applies when the input is omitted,
        # not when it's passed empty. Without this fallback the compare API
        # fails on forks and the classifier fails open (every lane forced on).
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CLASSIFICATION_MODE: ${{ inputs.classification_mode }}
        PUSH_BEFORE: ${{ inputs.push_before }}
        PUSH_AFTER: ${{ inputs.push_after }}
      run: |
        set -euo pipefail

        # Pull requests retain the existing compare-based classification.
        # The exact live-config push path also compares its before/after SHAs;
        # every other push/dispatch leaves CHANGED empty and therefore retains
        # the ordinary fail-open behavior.
        COMPARE_BASE=""
        COMPARE_HEAD=""
        if [ "$CLASSIFICATION_MODE" = "live_config_push" ]; then
          sha_pattern='^[0-9a-fA-F]{40}$'
          if [[ ! "$PUSH_BEFORE" =~ $sha_pattern ]] || \
             [[ ! "$PUSH_AFTER" =~ $sha_pattern ]] || \
             [[ "$PUSH_BEFORE" =~ ^0+$ ]] || [[ "$PUSH_AFTER" =~ ^0+$ ]]; then
            echo "::warning::live-config push has no usable before/after SHAs — failing open"
            CHANGED="__ambiguous_live_config_push__"
          else
            COMPARE_BASE="$PUSH_BEFORE"
            COMPARE_HEAD="$PUSH_AFTER"
          fi
        elif [ "$EVENT_NAME" = "pull_request" ]; then
          COMPARE_BASE="$BASE_SHA"
          COMPARE_HEAD="$HEAD_SHA"
        else
          CHANGED=""
        fi

        if [ -n "$COMPARE_BASE" ]; then
          CHANGED=""
          for i in 1 2 3; do
            if CHANGED="$(gh api \
              --paginate \
              "repos/${REPO}/compare/${COMPARE_BASE}...${COMPARE_HEAD}" \
              --jq '.files[]?.filename')"; then
              # GitHub caps compare responses at 300 files. Treat the cap as
              # ambiguous rather than risking a narrow gate on a partial diff.
              file_count="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l)"
              if [ "$file_count" -ge 300 ]; then
                echo "::warning::compare returned the file cap — failing open"
                CHANGED="__truncated_compare__"
              fi
              break
            fi
            if [ "$i" = 3 ]; then
              echo "::warning::compare API failed after 3 attempts — failing open (all lanes run)"
              CHANGED="__compare_failed__"
              break
            fi
            echo "::warning::compare API failed (attempt $i); retrying in 10s"
            sleep 10
          done
        fi

        echo "Changed files:"
        printf '%s\n' "${CHANGED:-(none)}"
        printf '%s\n' "${CHANGED:-}" | python3 scripts/ci/classify_changes.py
