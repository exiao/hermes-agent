name: Detect affected areas
description: >-
  Classify a PR's changed files into CI work lanes (python, frontend, site,
  scan, deps, mcp_catalog) so the orchestrator can conditionally call only
  the sub-workflows a PR can affect. Outputs are always "true" on push/dispatch
  events and fail open (everything "true") when the diff cannot be computed.

inputs:
  github-token:
    description: Token for the GitHub API (gh CLI). Pass steps.app-token.outputs.token from the calling workflow.
    required: false
    default: ${{ github.token }}
  classification-mode:
    description: Standard PR classification, or the allowlisted live-config push gate.
    required: false
    default: standard

outputs:
  python:
    description: Run Python tests / ruff / ty / windows-footguns.
    value: ${{ steps.classify.outputs.python }}
  e2e:
    description: Run Python end-to-end tests for runtime-sensitive paths.
    value: ${{ steps.classify.outputs.e2e }}
  frontend:
    description: Run the TypeScript testing matrix + desktop build.
    value: ${{ steps.classify.outputs.frontend }}
  docker_meta:
    description: Docker setup and meta files have changed.
    value: ${{ steps.classify.outputs.docker_meta }}
  site:
    description: Build the Docusaurus docs site.
    value: ${{ steps.classify.outputs.site }}
  scan:
    description: Run the supply-chain critical-pattern scanner.
    value: ${{ steps.classify.outputs.scan }}
  deps:
    description: Check pyproject.toml dependency upper bounds.
    value: ${{ steps.classify.outputs.deps }}
  npm_lock:
    description: Post/update the semantic package-lock.json diff PR comment.
    value: ${{ steps.classify.outputs.npm_lock }}
  mcp_catalog:
    description: Require MCP catalog security review label.
    value: ${{ steps.classify.outputs.mcp_catalog }}
  ci_review:
    description: Require CI-sensitive file review label.
    value: ${{ steps.classify.outputs.ci_review }}
  ci_review_files:
    description: JSON list of CI-sensitive files changed by the pull request.
    value: ${{ steps.classify.outputs.ci_review_files }}

runs:
  using: composite
  steps:
    - name: Classify changed files
      id: classify
      shell: bash
      env:
        # Fall back to the built-in read-only token when the caller passes an
        # empty value. Fork PRs get no repo secrets, so AUTOFIX_BOT_PAT is ""
        # there, and an input `default:` only applies when the input is omitted,
        # not when it's passed empty. Without this fallback the compare API
        # fails on forks and the classifier fails open (every lane forced on).
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        CLASSIFICATION_MODE: ${{ inputs.classification-mode }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BASE_SHA: ${{ github.event.before }}
        PUSH_HEAD_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        # Standard classification preserves the existing PR-only compare and
        # fail-open behavior. The live-config exception is enabled only by the
        # exact caller-selected mode and still fails open for an unavailable or
        # ambiguous push comparison.
        CHANGED=""
        if [ "$EVENT_NAME" = "pull_request" ]; then
          COMPARE_BASE="$BASE_SHA"
          COMPARE_HEAD="$HEAD_SHA"
        elif [ "$CLASSIFICATION_MODE" = "live_config_push" ] && \
             [ "$EVENT_NAME" = "push" ] && \
             [ "$REF" = "refs/heads/live-config" ] && \
             [ -n "$PUSH_BASE_SHA" ] && \
             [ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
          COMPARE_BASE="$PUSH_BASE_SHA"
          COMPARE_HEAD="$PUSH_HEAD_SHA"
        else
          COMPARE_BASE=""
          COMPARE_HEAD=""
        fi

        if [ -n "$COMPARE_BASE" ] && [ -n "$COMPARE_HEAD" ]; then
          # Compare pinned event SHAs rather than shallow checkout history. The
          # API is retried, then an error or GitHub's 300-file response cap
          # deliberately becomes an empty diff so every lane runs rather than
          # skipping validation for an omitted path.
          for i in 1 2 3; do
            if COMPARE="$(gh api \
              "repos/${REPO}/compare/${COMPARE_BASE}...${COMPARE_HEAD}")"; then
              CHANGED="$(printf '%s' "$COMPARE" | python3 -c 'import json, sys; files = json.load(sys.stdin).get("files", []); complete = isinstance(files, list) and len(files) < 300; print(*(item["filename"] for item in files if "filename" in item), sep="\n") if complete else print("::warning::compare response is incomplete or reaches the 300-file cap - failing open", file=sys.stderr)')"
              break
            fi
            if [ "$i" = 3 ]; then
              echo "::warning::compare API failed after 3 attempts — failing open (all lanes run)"
              CHANGED=""
              break
            fi
            echo "::warning::compare API failed (attempt $i); retrying in 10s"
            sleep 10
          done
        fi

        echo "Changed files:"
        printf '%s\n' "${CHANGED:-(none)}"
        printf '%s\n' "${CHANGED:-}" | python3 scripts/ci/classify_changes.py "$CLASSIFICATION_MODE"
